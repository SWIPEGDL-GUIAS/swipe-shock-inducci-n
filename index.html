<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWIPE® Shock — Inducción Interactiva | Mantenimiento</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(30, 41, 59, 0.85);
            --accent: #eab308;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(51, 65, 85, 0.6);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; position: relative; overflow-x: hidden; }
        
        /* Fondo de partículas estelar */
        .stars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: -1; pointer-events: none; }
        .star { position: absolute; background: #38bdf8; opacity: 0.5; border-radius: 50%; animation: twinkle 4s infinite ease-in-out; }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.2); } }

        .container { width: 100%; max-width: 440px; background: var(--card-bg); backdrop-filter: blur(12px); border-radius: 1.5rem; border: 1px solid var(--border); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); overflow: hidden; display: flex; flex-direction: column; min-height: 600px; z-index: 1; }
        header { background: rgba(17, 24, 39, 0.9); padding: 0.85rem 1.25rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); font-size: 0.8rem; color: var(--accent); font-weight: 700; letter-spacing: 0.05em; }
        
        .top-controls { display: flex; gap: 0.4rem; }
        .control-btn { background: rgba(51, 65, 85, 0.6); border: 1px solid var(--border); color: #fff; padding: 0.3rem 0.6rem; border-radius: 0.375rem; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; }
        .control-btn.active { background: var(--accent); color: #111827; font-weight: 700; border-color: var(--accent); }
        
        .content { padding: 1.75rem; flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; }
        h1 { font-size: 1.45rem; margin-bottom: 0.75rem; color: var(--text-main); font-weight: 700; }
        p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.25rem; }
        
        .badge { display: inline-block; background: rgba(234, 179, 8, 0.15); color: var(--accent); padding: 0.3rem 0.85rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; margin-bottom: 1.25rem; border: 1px solid rgba(234, 179, 8, 0.3); }
        
        .avatar-container { margin-bottom: 1.25rem; display: flex; justify-content: center; }
        .avatar { width: 72px; height: 72px; background: rgba(51, 65, 85, 0.8); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.25rem; border: 2px solid var(--accent); box-shadow: 0 0 20px rgba(234, 179, 8, 0.3); animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        .btn { background: var(--accent); color: #111827; border: none; padding: 0.85rem 1.5rem; border-radius: 0.75rem; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.2s; width: 100%; margin-top: auto; box-shadow: 0 4px 12px rgba(234, 179, 8, 0.3); }
        .btn:hover { opacity: 0.95; transform: scale(1.02); }
        
        .footer-nav { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; background: rgba(17, 24, 39, 0.9); border-top: 1px solid var(--border); font-size: 0.85rem; color: var(--text-muted); }
        .footer-nav button { background: none; border: none; color: var(--accent); cursor: pointer; font-weight: 600; font-size: 0.9rem; }
        .footer-nav button:hover { text-decoration: underline; }
        
        .list-box { text-align: left; background: rgba(15, 23, 42, 0.7); border: 1px solid var(--border); padding: 1.15rem; border-radius: 0.85rem; margin-bottom: 1rem; font-size: 0.875rem; }
        .list-box li { margin-bottom: 0.6rem; color: var(--text-muted); line-height: 1.4; }
        .list-box strong { color: var(--text-main); }
        
        .progress-dots { display: flex; gap: 4px; align-items: center; }
        .dot { width: 6px; height: 6px; background: var(--border); border-radius: 50%; transition: all 0.3s; }
        .dot.active { background: var(--accent); width: 16px; border-radius: 3px; }
    </style>
</head>
