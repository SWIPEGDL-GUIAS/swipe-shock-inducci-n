<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWIPE® Shock — Inducción Interactiva</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(30, 41, 59, 0.95);
            --accent: #eab308;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(51, 65, 85, 0.6);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; }
        .container { width: 100%; max-width: 440px; background: var(--card-bg); border-radius: 1.5rem; border: 1px solid var(--border); box-shadow: 0 25px 50px rgba(0,0,0,0.8); display: flex; flex-direction: column; min-height: 560px; overflow: hidden; }
        header { background: #0f172a; padding: 1rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); font-size: 0.8rem; color: var(--accent); font-weight: 700; }
        .content { padding: 2rem; flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; color: var(--text-main); }
        p { color: var(--text-muted); font-size: 1rem; line-height: 1.6; margin-bottom: 1.5rem; }
        .badge { display: inline-block; background: rgba(234, 179, 8, 0.15); color: var(--accent); padding: 0.35rem 1rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; margin-bottom: 1.5rem; border: 1px solid rgba(234, 179, 8, 0.3); }
        .btn { background: var(--accent); color: #111827; border: none; padding: 0.9rem; border-radius: 0.75rem; font-weight: 700; font-size: 1rem; cursor: pointer; width: 100%; margin-top: auto; }
        .footer-nav { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; background: #0f172a; border-top: 1px solid var(--border); font-size: 0.9rem; }
        .footer-nav button { background: none; border: none; color: var(--accent); cursor: pointer; font-weight: 600; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <span>SWIPE® SHOCK · MANTENIMIENTO</span>
            <span id="slide-counter">1 / 5</span>
        </header>
        <div class="content" id="slide-content"></div>
        <div class="footer-nav">
            <button onclick="prevSlide()">← Anterior</button>
            <button onclick="nextSlide()">Siguiente →</button>
        </div>
    </div>
    <script>
        const slides = [
            { badge: "00 // BIENVENIDA", title: "Conociendo SWIPE® Shock", text: "Solvente dieléctrico biodegradable diseñado para la limpieza segura de equipos eléctricos fuera de operación." },
            { badge: "01 // PERFIL TÉCNICO", title: "¿Qué es SWIPE® Shock?", text: "Formulado con destilados cítricos biodegradables. Remueve grasa, aceite y carboncillos de manera eficaz." },
            { badge: "02 // RIGIDEZ DIELÉCTRICA", title: "Seguridad Garantizada", text: "Posee una rigidez dieléctrica superior a 36.2 kV, impidiendo la formación de arcos eléctricos." },
            { badge: "03 // APLICACIÓN", title: "Uso y Restricciones", text: "Aplicar directamente en motores y tableros fuera de operación. Nunca aplicar en equipos energizados." },
            { badge: "04 // CIERRE", title: "Inducción Concluida", text: "Has completado la guía técnica rápida de SWIPE® Shock. Consulta siempre la hoja MSDS." }
        ];
        let current = 0;
        function render() {
            const s = slides[current];
            document.getElementById('slide-content').innerHTML = `
                <div class="badge">${s.badge}</div>
                <h1>${s.title}</h1>
                <p>${s.text}</p>
            `;
            document.getElementById('slide-counter').innerText = `${current + 1} / ${slides.length}`;
        }
        function nextSlide() { if(current < slides.length - 1) { current++; render(); } }
        function prevSlide() { if(current > 0) { current--; render(); } }
        render();
    </script>
</body>
</html>
